# Native desktop capture plus an independent offline combined-video worker.
services:
  desktop:
    image: ${UAV_NATIVE_DESKTOP_IMAGE:-uav-sim-native-desktop:development}
    build:
      context: .
      dockerfile: src/desktop/Dockerfile.native-recording
      args:
        RUNTIME_IMAGE: ${UAV_NATIVE_DESKTOP_BASE_IMAGE:-uav-sim-stack:development}
    command: [python, -m, desktop.main]
    environment:
      UAV_NATIVE_SCREEN_RECORDING: 'true'
  control-panel:
    environment:
      UAV_LIVE_MAPPING: 'true'
  camera-streams:
    environment:
      GZ_PARTITION: uav-visual-odometry
      UAV_CAMERA_WIDTH: '640'
      UAV_CAMERA_HEIGHT: '480'
      UAV_CAMERA_RATE_HZ: '5'
      UAV_CAMERA_FOV_RAD: '1.4'
      UAV_CAMERA_BASELINE_M: '0.4'
      UAV_CAMERA_HEIGHT_M: '0.5'
      UAV_CAMERA_PITCH_RAD: '1.1'
  replay-renderer:
    environment:
      UAV_REPLAY_NATIVE_COMPOSITE: 'true'
      UAV_REPLAY_MODEL_ROOT: /assets
      UAV_REPLAY_MODEL_REVISION_FILE: /assets/models-revision
    volumes:
      - ${UAV_REPLAY_ASSETS_DIRECTORY:?Set the retained revision-matched aircraft asset directory}:/assets:ro
